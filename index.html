<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S // TERMINAL_V2</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050805;
      color: #00FF66;
      font-family: 'Share Tech Mono', monospace;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      text-transform: uppercase;
    }

    .terminal-frame {
      max-width: 950px;
      width: 100%;
      border: 3px double #00FF66;
      background: #000000;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: relative;
    }

    /* Effetto scanline sullo schermo */
    .terminal-frame::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 50;
      pointer-events: none;
    }

    .terminal-header {
      border-bottom: 2px dashed #00FF66;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
    }

    .terminal-screen-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 15px;
    }

    @media (max-width: 768px) {
      .terminal-screen-grid { grid-template-columns: 1fr; }
    }

    /* Radar / Monitor Circolare */
    .radar-monitor {
      width: 100%;
      height: 340px;
      border: 2px solid #00FF66;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle, #001103 0%, #000000 80%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 30px rgba(0, 255, 102, 0.4);
    }

    .radar-grid-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 102, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 102, 0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      border-radius: 50%;
    }

    .radar-sweep {
      position: absolute;
      width: 50%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00FF66);
      top: 50%;
      left: 50%;
      transform-origin: left center;
      animation: sweep 4s linear infinite;
    }

    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .radar-node {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #00FF66;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px #00FF66;
      transition: transform 0.2s;
      z-index: 10;
    }

    .radar-node:hover {
      transform: scale(1.8);
      background: #FFFFFF;
    }

    /* Console di Log / Dati stile terminale verde */
    .console-panel {
      border: 1px solid #00FF66;
      padding: 15px;
      background: rgba(0, 255, 102, 0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      min-height: 340px;
    }

    .console-logs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
    }

    .log-line {
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-left: 2px solid #00FF66;
      padding-left: 8px;
    }

    .log-label {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .log-value {
      font-size: 0.95rem;
      color: #FFF;
    }

    .terminal-input-bar {
      display: flex;
      gap: 10px;
      border-top: 1px dashed #00FF66;
      padding-top: 10px;
    }

    .terminal-input-bar input {
      width: 100%;
      background: #000;
      border: 1px solid #00FF66;
      color: #00FF66;
      padding: 8px;
      font-family: 'Share Tech Mono', monospace;
      outline: none;
    }

    .terminal-btn {
      background: #00FF66;
      color: #000;
      border: none;
      padding: 0 15px;
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
      cursor: pointer;
    }

    .terminal-btn:hover {
      background: #FFF;
    }

    .status-footer {
      font-size: 0.8rem;
      border-top: 2px double #00FF66;
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
    }

    a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>

  <div class="terminal-frame">
    
    <div class="terminal-header">
      <span>// COSMIC_SYS_v2.0</span>
      <span>[STATUS: ONLINE]</span>
    </div>

    <div class="terminal-screen-grid">
      
      <!-- Schermo Radar Centrale -->
      <div class="radar-monitor" id="radarScreen">
        <div class="radar-grid-lines"></div>
        <div class="radar-sweep"></div>
        
        <!-- Nodi radar posizionati con coordinate percentuali -->
        <div class="radar-node" style="top: 30%; left: 40%;" 
             data-name="STARLINK_01" data-freq="142.5 MHz" data-status="STABILE" data-link="https://www.wikipedia.org"></div>
        <div class="radar-node" style="top: 60%; left: 70%;" 
             data-name="NEO_PULSAR" data-freq="89.2 MHz" data-status="IN ORBITA" data-link="https://neocities.org"></div>
        <div class="radar-node" style="top: 75%; left: 30%;" 
             data-name="TIME_WANDERER" data-freq="210.0 MHz" data-status="SEGNALE DEBOLE" data-link="https://archive.org"></div>
      </div>

      <!-- Pannello Dati / Log a destra -->
      <div class="console-panel">
        <div class="console-logs" id="consoleLogs">
          <div class="log-line">
            <span class="log-label">> SELEZIONA UN NODO RADAR O CLICCA SOTTO</span>
            <span class="log-value">Pronto per la scansione...</span>
          </div>
          <div class="log-line">
            <span class="log-label">> FREQUENZA ATTIVA</span>
            <span class="log-value">---</span>
          </div>
          <div class="log-line">
            <span class="log-label">> TELEMETRIA / NOTE</span>
            <span class="log-value">Nessun utente selezionato.</span>
          </div>
        </div>

        <div id="visitContainer" style="display:none; margin-top: 10px;">
          <a href="#" id="visitLink" target="_blank" style="display:block; background:#00FF66; color:#000; text-align:center; padding:6px; font-weight:bold;">[ ACCEDI AL LINK UTENTE ]</a>
        </div>

        <div class="terminal-input-bar">
          <input type="text" id="terminalInput" placeholder="Cerca ID nel sistema...">
          <button class="terminal-btn" id="searchBtn">QUERY</button>
        </div>
      </div>

    </div>

    <div class="status-footer">
      <span>SECTOR: 138E/12</span>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" style="text-decoration: underline;">[ TORNA ALLA HOME ]</a>
    </div>

  </div>

  <script>
    const nodes = document.querySelectorAll('.radar-node');
    const logValueNode = document.getElementById('consoleLogs');
    const visitContainer = document.getElementById('visitContainer');
    const visitLink = document.getElementById('visitLink');

    nodes.forEach(node => {
      node.addEventListener('click', () => {
        const name = node.getAttribute('data-name');
        const freq = node.getAttribute('data-freq');
        const status = node.getAttribute('data-status');
        const url = node.getAttribute('data-link');

        logValueNode.innerHTML = `
          <div class="log-line">
            <span class="log-label">> NODO TARGET</span>
            <span class="log-value">${name}</span>
          </div>
          <div class="log-line">
            <span class="log-label">> FREQUENZA</span>
            <span class="log-value">${freq}</span>
          </div>
          <div class="log-line">
            <span class="log-label">> STATO SEGNALE</span>
            <span class="log-value">${status}</span>
          </div>
        `;

        visitLink.href = url;
        visitContainer.style.display = 'block';
      });
    });
  </script>

</body>
</html>
